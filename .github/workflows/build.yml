name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOPEN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/autopen.jks"
            echo "AUTOPEN_KEYSTORE_PATH=$RUNNER_TEMP/autopen.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key in secrets — APK will be signed with debug key"
          fi

      - name: Build release APK
        env:
          AUTOPEN_KEYSTORE_PASSWORD: ${{ secrets.AUTOPEN_KEYSTORE_PASSWORD }}
          AUTOPEN_KEY_ALIAS: ${{ secrets.AUTOPEN_KEY_ALIAS }}
          AUTOPEN_KEY_PASSWORD: ${{ secrets.AUTOPEN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AutoPen-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPen-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
